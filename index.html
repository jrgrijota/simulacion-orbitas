<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Órbitas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-inner">

            <div class="sim-header">
                <div class="sim-logo">🪐</div>
                <div>
                    <div class="sim-title">Laboratorio de Órbitas</div>
                    <div class="sim-subtitle">Mecánica Orbital · Newton · Kepler</div>
                </div>
            </div>

            <div class="card mode-card">
                <select id="mode-select">
                    <option value="newton">Bala de Cañón de Newton</option>
                    <option value="planets">Sistema Solar</option>
                    <option value="kepler">Leyes de Kepler</option>
                    <option value="binary">Estrellas Binarias</option>
                </select>
            </div>

            <div id="mode-ui"></div>

        </div>
    </aside>

    <div id="canvas-holder">
        <div id="sim-frame"></div>
    </div>

    <script src="js/sketch.js"></script>
</body>
</html>
