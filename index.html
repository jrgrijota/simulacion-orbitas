<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órbitas y Gravitación</title>
    <!-- Página pública de esta simulación: simulaciencia.es. Esta dirección (github.io) es la que carga la web dentro de un iframe; la canónica evita que los buscadores la indexen como página aparte. -->
    <meta name="description" content="Mecánica orbital con la bala de cañón de Newton, el Sistema Solar, las leyes de Kepler y las estrellas binarias en una misma simulación.">
    <link rel="canonical" id="canonical" href="https://simulaciencia.es/simulaciones/orbitas/">
    <script>(function(){var d={"en":"en/simulations/","ca":"ca/simulacions/","eu":"eu/simulazioak/","gl":"gl/simulacions/"}[new URLSearchParams(location.search).get('lang')];if(d)document.getElementById('canonical').href='https://simulaciencia.es/'+d+'orbitas/';})();</script>
    <script src="js/i18n-en.js"></script>
    <script src="js/i18n-ca.js"></script>
    <script src="js/i18n-eu.js"></script>
    <script src="js/i18n-gl.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/vendor/p5.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="js/estadisticas.js" data-sim="sim-orbitas"></script>
    <script src="js/sello.js" data-contenedor="#canvas-holder" data-esquina="br"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-inner">

            <div class="sim-header">
                <div class="sim-logo">🪐</div>
                <div>
                    <div class="sim-title">Órbitas y Gravitación</div>
                    <div class="sim-subtitle">Mecánica Orbital · Newton · Kepler</div>
                </div>
            </div>

            <div class="card mode-card">
                <select id="mode-select" aria-label="Modo de simulación">
                    <option value="newton">Bala de Cañón de Newton</option>
                    <option value="planets">Sistema Solar</option>
                    <option value="kepler">Leyes de Kepler</option>
                    <option value="binary">Estrellas Binarias</option>
                </select>
            </div>

            <div id="mode-ui"></div>

        </div>
    </aside>

    <div id="canvas-holder">
        <div id="sim-frame"></div>
    </div>

    <script src="js/parametros.js"></script>

    <script src="js/sketch.js"></script>
</body>
</html>
